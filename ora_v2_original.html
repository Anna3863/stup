<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>stup</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--cd:#fff;--tx:#1a1c2c;--mu:#6b7087;--ln:#e4e6ef;--ac:#5a3df0;--on:#fff;--g:linear-gradient(45deg,#f9a03f,#f0467a,#7b3ff2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0f17;--cd:#171926;--tx:#eceef8;--mu:#9a9fb8;--ln:#272a3b;--ac:#8d78ff;--on:#10101a}}
:root[data-theme=dark]{--bg:#0e0f17;--cd:#171926;--tx:#eceef8;--mu:#9a9fb8;--ln:#272a3b;--ac:#8d78ff;--on:#10101a}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}small,.mu{color:var(--mu);font-size:13px}hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--ln);padding:10px 14px}
.hr{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto;flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;letter-spacing:-1px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:2px;margin-left:auto}.nav button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer}.nav .on{color:var(--tx);background:var(--bg)}
.pill{border:1px solid var(--ln);border-radius:99px;padding:4px 11px;font-weight:600;font-size:13px}
.sb{display:flex;gap:6px;max-width:760px;margin:10px auto 0;flex-wrap:wrap}.sb>*{flex:0 0 auto}.sb input{flex:1 1 200px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer}.seg .on{background:var(--cd);color:var(--tx)}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.pr{display:flex;align-items:center;gap:12px}.g1{flex:1}.g1 b{cursor:pointer}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--g);padding:3px;display:grid}.av span{background:var(--cd);border-radius:50%;display:grid;place-items:center;font-weight:800}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ch{background:var(--bg);border-radius:99px;padding:3px 10px;font-size:13px}.ch b{color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn,.bt2{font:inherit;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--ac)}.btn{background:var(--ac);color:var(--on)}.bt2{background:none;color:var(--ac);border-color:var(--ln)}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;max-width:100%}
.sb select{width:auto}.f{display:grid;gap:10px}.f label{font-weight:600;font-size:13px}
.ad{display:flex;gap:10px;align-items:center;border:1px dashed var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:var(--mu);font-size:12px}.ad b{color:var(--tx)}
.er{color:#d6336c;font-weight:600;min-height:1.3em}
.sj{padding:10px 0;border-top:1px solid var(--ln)}.ns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}.sj.off .ns{display:none}.sj.off .g1{color:var(--mu)}
.nb{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;padding:0}.nb.on{background:var(--g);color:#fff;border-color:transparent}
input.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;padding:0;border:0;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;flex:none}
input.sw:checked{background:var(--ac)}input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}input.sw:checked::after{left:19px}
.li{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.li.on{background:var(--bg)}
.bub{max-width:80%;padding:7px 12px;border-radius:14px;margin:4px 0;background:var(--bg)}.bub.me{margin-left:auto;background:var(--ac);color:var(--on)}.bub.sy{margin:6px auto;background:none;color:var(--mu);font-size:13px;text-align:center}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.tag{display:inline-block;background:#f0467a22;color:#d6336c;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
#md{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:9}#md>div{background:var(--cd);border-radius:16px;padding:18px;width:min(460px,100%);max-height:88%;overflow:auto}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:10;max-width:90%}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><div id="app"></div><div id="md" onclick="if(event.target==this)cl()"><div id="mb"></div></div><div id="t"></div>
<script>
const PT="Pass",SUBJ=[["Limba și literatura română","Romanian language and literature"],["Matematică","Mathematics"],["Fizică","Physics"],["Chimie","Chemistry"],["Biologie","Biology"],["Istorie","History"],["Geografie","Geography"],["Informatică","Computer science"],["TIC","ICT"],["Engleză","English"],["Franceză","French"],["Germană","German"],["Spaniolă","Spanish"],["Latină","Latin"],["Logică","Logic"],["Psihologie","Psychology"],["Filosofie","Philosophy"],["Economie","Economics"],["Educație socială","Social education"],["Educație plastică","Art"],["Educație muzicală","Music"],["Educație fizică","Physical education"],["Religie","Religion"],["Tehnologii","Technology"],["Științe ale naturii","Natural sciences"],["Antreprenoriat","Entrepreneurship"]],
CY="Alba|Arad|Argeș|Bacău|Bihor|Bistrița-Năsăud|Botoșani|Brașov|Brăila|București|Buzău|Caraș-Severin|Călărași|Cluj|Constanța|Covasna|Dâmbovița|Dolj|Galați|Giurgiu|Gorj|Harghita|Hunedoara|Ialomița|Iași|Ilfov|Maramureș|Mehedinți|Mureș|Neamț|Olt|Prahova|Satu Mare|Sălaj|Sibiu|Suceava|Teleorman|Timiș|Tulcea|Vaslui|Vâlcea|Vrancea".split('|'),
BAD=/(mailinator|tempmail|temp-mail|10minutemail|guerrillamail|yopmail|trashmail|throwaway|sharklasers|getnada|dispostable|maildrop)/i;
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return''+h};
let S;try{S=JSON.parse(localStstupge.getItem('stup2'))}catch(e){}S=S||{reg:[],me:0,th:[],v:'feed',o:0,m:'s',res:null,au:0,qs:1,qg:7,lg:/^ro/i.test(navigator.language)?'ro':'en'};
const sv=()=>{try{localStstupge.setItem('stup2',JSON.stringify(S))}catch(e){}},x=(a,b)=>S.lg=='ro'?b:a,sn=i=>SUBJ[i][S.lg=='ro'?0:1],lv=i=>x(["Middle school","High school","University"],["Gimnaziu","Liceu","Universitate"])[i],
me=()=>S.reg.find(u=>u.id==S.me),U=id=>S.reg.find(u=>u.id==id),ok=(a,b)=>Math.abs(a.age-b.age)<=3&&Math.abs(a.lv-b.lv)<2,
oth=u=>S.reg.filter(p=>p.id!=u.id&&p.cy==u.cy&&ok(u,p)&&p.ban<Date.now()),
star=p=>p.c?`★ ${p.r.toFixed(1)} <small>(${p.c})</small>`:`<small>${x('New','Nou')}</small>`,
tp=p=>SUBJ.map((s,i)=>[i,p.sc[s[0]]||0]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).slice(0,3),
tt=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(tt.x);tt.x=setTimeout(()=>t.style.display='none',4500)},
mo=h=>{$('#mb').innerHTML=h;$('#md').style.display='grid'},cl=()=>$('#md').style.display='none',
opt=(l,s)=>l.map((n,i)=>`<option value=${i}${i==s?' selected':''}>${E(n)}</option>`).join(''),
av=n=>`<div class=av><span>${E(n[0])}</span></div>`,
lgb=()=>`<button class=bt2 onclick="S.lg=S.lg=='ro'?'en':'ro';sv();render()">${S.lg=='ro'?'English':'Română'}</button>`;
function cnpAge(c){if(!/^\d{13}$/.test(c))return;let t=0;[2,7,9,1,4,6,3,5,8,2,7,9].forEach((w,i)=>t+=w*c[i]);let k=t%11;if(k==10)k=1;if(k!=c[12])return;const b={1:1900,2:1900,3:1800,4:1800,5:2000,6:2000}[c[0]];return b?2026-b-c.slice(1,3):void 0}
async function sm(){try{return await window.claude?.use('sample')}catch(e){return null}}
async function ask(q){const s=await sm();if(!s)return'';try{return(await s(q)).text.trim()}catch(e){return''}}
async function mod(t){if(/(idiot|stupid|hate you|prost|tâmpit|fuck|shit)/i.test(t))return 0;const r=await ask('You moderate comments on a school peer-tutoring site. Reply only OK or BLOCK. Block insults, harassment, personal data, sexual content.\nComment: '+t);return r&&!/^OK/i.test(r)?0:1}
function render(){const u=me(),a=$('#app');document.documentElement.lang=S.lg;if(!u){a.innerHTML=S.au?login():signup();return}
const V={feed,inbox,rate:()=>rateV(u,1),set:setV};
a.innerHTML=hd(u)+`<main class=wrap>${V[S.v](u)}<div class=ad><span>${x('Sponsored','Sponsorizat')}</span><b>Carte&amp;Co</b> ${x('Bac prep workbooks, 15% off.','Culegeri pentru BAC, 15% reducere.')}</div></main>`}
const hd=u=>`<div class=hd><div class=hr><span class=logo>stup</span><div class=nav>${[['feed',x('Discover','Descoperă')],['inbox','Inbox'],['set',x('Settings','Setări')]].map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="S.v='${k}';render()">${l}</button>`).join('')}</div>${lgb()}<span class=pill>✦ ${u.l} ${PT}</span></div>
${S.v=='feed'?`<div class=sb><div class=seg><button class="${S.m=='s'?'on':''}" onclick="S.m='s';render()">${x('Subject','Materie')}</button><button class="${S.m=='a'?'on':''}" onclick="S.m='a';render()">${x('Ask AI','Întreabă AI')}</button></div>${S.m=='s'?`<select id=qs>${opt(SUBJ.map((s,i)=>sn(i)),S.qs)}</select><select id=qg>${[...Array(10)].map((_,i)=>`<option value=${i+1}${i+1==S.qg?' selected':''}>${i+1}+</option>`).join('')}</select>`:`<input id=qa placeholder="${x('Describe your problem','Descrie problema ta')}">`}<button class=btn onclick=go()>${x('Search','Caută')}</button></div>`:''}</div>`;
const card=p=>`<div class=c><div class=pr onclick=op(${p.id})>${av(p.n)}<div class=g1><b>${E(p.n)}</b><br><small>${lv(p.lv)}, ${x('age','vârsta')} ${p.age}, ${E(p.cy)}</small></div><span>${star(p)}</span></div><div class=chs>${tp(p).map(([i,v])=>`<span class=ch>${E(sn(i))} <b>${v}/10</b></span>`).join('')}</div>${p.k?`<span class=tag>${p.half?x('Rating halved after a report','Notă înjumătățită după o reclamație'):x('Warned','Avertizat')}</span>`:''}<div class=row><button class=bt2 onclick=op(${p.id})>${x('Profile','Profil')}</button><button class=btn ${me().ver?'':'disabled'} onclick=msg(${p.id})>${x('Message','Mesaj')}</button></div></div>`;
function feed(u){let h=u.ver?'':`<div class=c><b>${x('Student ID pending review','Legitimația este în curs de verificare')}</b><p class=mu>${x('You can browse, but messaging unlocks after your student ID is verified.','Poți căuta, dar mesageria se deblochează după verificarea legitimației.')}</p></div>`;
if(S.res)return h+`<div class=row style="justify-content:space-between"><b>${E(S.res.t)}</b><button class=bt2 onclick="S.res=null;render()">${x('Clear','Șterge')}</button></div>`+(S.res.h||`<p class=mu>${x('No matches yet.','Niciun rezultat încă.')}</p>`);
const l=oth(u);return h+l.map((p,i)=>card(p)+(i==1?`<div class=ad><span>${x('Sponsored','Sponsorizat')}</span><b>Zen Notebooks</b> ${x('Paper that survives exam season.','Hârtie care rezistă sesiunii.')}</div>`:'')).join('')||`<p class=mu>${x('No one from your county and age range yet. Invite your classmates.','Încă nu e nimeni din județul și intervalul tău de vârstă. Invită-ți colegii.')}</p>`}
async function go(){const u=me();if(S.m=='s'){S.qs=+$('#qs').value;S.qg=+$('#qg').value;const k=SUBJ[S.qs][0];S.res={t:`${sn(S.qs)}, ${x('grade','nota')} ${S.qg}+`,h:oth(u).filter(p=>(p.sc[k]||0)>=S.qg).sort((a,b)=>b.sc[k]-a.sc[k]).map(card).join('')}}
else{const q=$('#qa').value.trim();if(!q)return;S.res={t:x('Searching…','Se caută…'),h:''};render();
const O=oth(u),L=S.th.filter(t=>{const b=U(t.b);return b&&!b.po&&O.includes(b)&&t.m[0]});let ix=[];
const r=L.length?await ask(`Past requests:\n${L.map((t,i)=>i+': '+t.m[0].t).join('\n')}\nStudent problem: ${q}\nReply only a JSON array of up to 3 indexes of the most similar past requests, best first.`):'',m=r.match(/\[[\d,\s]*\]/);
if(m)try{ix=JSON.parse(m[0])}catch(e){}
if(!ix.length){const w=q.toLowerCase().split(/\W+/).filter(y=>y.length>3);ix=L.map((t,i)=>[i,w.filter(y=>t.m[0].t.toLowerCase().includes(y)).length]).filter(y=>y[1]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(y=>y[0])}
S.res={t:x('People with similar problems','Persoane cu probleme similare'),h:ix.map(i=>L[i]).filter(Boolean).map(t=>`<div class=c><small>${x('Someone with a similar problem','Cineva cu o problemă similară')}</small><p>“${E(t.m[0].t)}”</p><small>${x('They reached out to:','A cerut ajutor de la:')}</small></div>${card(U(t.b))}`).join('')}}render()}
function op(id){const p=U(id);mo(`<div class=pr>${av(p.n)}<div class=g1><b>${E(p.n)}</b><br><small>${lv(p.lv)}, ${x('age','vârsta')} ${p.age}, ${E(p.cy)}</small></div><span>${star(p)}</span></div>${p.ban>Date.now()?`<p><span class=tag>${x('Banned until','Blocat până la')} ${new Date(p.ban).toLocaleDateString()}</span></p>`:''}<h4>${x('Strong in','Se pricepe la')}</h4>${SUBJ.map((s,i)=>[i,p.sc[s[0]]||0]).filter(a=>a[1]).map(([i,v])=>`<small>${E(sn(i))}, ${v}/10</small><div class=bar><i style="width:${v*10}%"></i></div>`).join('')}<h4>${x('Comments, checked by AI','Comentarii, verificate de AI')}</h4>${p.cm.map(c=>`<p>“${E(c)}”</p>`).join('')||`<p class=mu>${x('No comments yet.','Încă nu sunt comentarii.')}</p>`}<div class=row>${p.id==S.me?'':`<button class=btn ${me().ver?'':'disabled'} onclick=msg(${id})>${x('Message','Mesaj')}</button>`}<button class=bt2 onclick=cl()>${x('Close','Închide')}</button></div>`)}
function msg(id){const u=me();if(!u.ver)return tt(x('Verify your student ID first.','Verifică mai întâi legitimația.'));const t=S.th.find(y=>y.a==u.id&&y.b==id||y.b==u.id&&y.a==id);if(t){S.o=t.id;S.v='inbox';cl();return render()}
mo(`<b>${x('Message','Mesaj pentru')} ${E(U(id).n)}</b><p class=mu>${x('They must accept your request before you can chat. They will see your rating first.','Trebuie să accepte cererea înainte să puteți vorbi. Vor vedea mai întâi nota ta.')}</p><textarea id=m1 rows=4 placeholder="${x('What do you need help with?','Cu ce ai nevoie de ajutor?')}"></textarea><div class=row><button class=btn onclick=snd0(${id})>${x('Send request','Trimite cererea')}</button><button class=bt2 onclick=cl()>${x('Cancel','Anulează')}</button></div>`)}
function snd0(id){const v=$('#m1').value.trim();if(!v)return;const u=me(),t={id:Date.now(),a:u.id,b:id,st:'pending',m:[{f:u.id,t:v}]};S.th.push(t);S.o=t.id;S.v='inbox';cl();sv();render();tt(x('Request sent. They will see it when they log in.','Cerere trimisă. O vor vedea când se conectează.'))}
function inbox(u){const mine=S.th.filter(t=>t.a==u.id||t.b==u.id),t=mine.find(y=>y.id==S.o);return`<div class=c><b>Inbox</b>${mine.map(y=>{const o=U(y.a==u.id?y.b:y.a);return`<div class="li ${y.id==S.o?'on':''}" onclick="S.o=${y.id};render()">${av(o.n)}<div><b>${E(o.n)}</b><br><small>${y.st=='pending'?(y.b==u.id?x('Wants to chat. Review request','Vrea să vorbească. Vezi cererea'):x('Waiting for a reply','Se așteaptă răspuns')):y.st=='no'?x('Declined','Refuzat'):E(y.m[y.m.length-1].t.slice(0,50))}</small></div></div>`}).join('')||`<p class=mu>${x('No chats yet. Find someone in Discover and send a request.','Nicio conversație încă. Găsește pe cineva în Descoperă și trimite o cerere.')}</p>`}</div>`+(t?thr(t,u):'')}
function thr(t,u){const sd=t.a==u.id,o=U(sd?t.b:t.a),se=t.se,pn=m=>`<div class="bub ${m.sy?'sy':m.f==u.id?'me':''}">${E(m.t)}</div>`;
let h=`<div class=c><div class=pr onclick=op(${o.id})>${av(o.n)}<div class=g1><b>${E(o.n)}</b><br><small>${star(o)}</small></div><button class=bt2>${x('Profile','Profil')}</button></div><hr>`;
if(t.st=='pending')h+=t.m.map(pn).join('')+(sd?`<p class=mu>${x('Waiting for them to accept.','Se așteaptă acceptarea.')}</p>`:`<p class=mu>${x('Check their rating first. You can chat only after accepting.','Verifică întâi nota lor. Poți vorbi doar după ce accepți.')}</p><div class=row><button class=btn onclick=ar(${t.id},1)>${x('Accept','Acceptă')}</button><button class=bt2 onclick=ar(${t.id},0)>${x('Decline','Refuză')}</button></div>`);
else if(t.st=='no')h+=`<p class=mu>${x('This request was declined.','Cererea a fost refuzată.')}</p>`;
else{h+=t.m.map(pn).join('');
if(!se){const ip=u.ver&&o.ver;h+=`<div class=row><input id=m2 placeholder="${x('Message','Mesaj')}" style="flex:1"><button class=bt2 onclick=snd(${t.id})>${x('Send','Trimite')}</button></div>`;
h+=sd?`<hr><b>${x('Book a session','Programează o sesiune')}</b><div class=f><input id=bw type=datetime-local><select id=bm><option value=online>${x('Online (video link)','Online (link video)')}</option><option value=real ${ip?'':'disabled'}>${x('In person','Față în față')}${ip?'':x(' (both need a verified student ID)',' (ambii aveți nevoie de legitimație verificată)')}</option></select><button class=btn ${u.l<1?'disabled':''} onclick=bk(${t.id})>${x('Spend 1 '+PT+' and book','Folosește 1 '+PT+' și programează')}</button>${u.l<1?`<small>${x('You have no '+PT+'. Teach someone to earn more.','Nu mai ai '+PT+'. Ajută pe cineva ca să primești.')}</small>`:''}</div>`:`<p class=mu>${x('Waiting for them to book a time.','Se așteaptă programarea unei ore.')}</p>`}
else{h+=`<p><b>${se.st=='done'?x('Session completed','Sesiune încheiată'):x('Session booked','Sesiune programată')}</b><br><small>${new Date(se.w).toLocaleString(S.lg=='ro'?'ro-RO':'en-GB')}, ${se.m=='real'?x('in person, meet in a public place','față în față, într-un loc public'):'online'}</small></p>`;
if(se.m!='real')h+=`<p><a href=https://meet.jit.si/stup-${t.id} target=_blank rel=noopener>meet.jit.si/stup-${t.id}</a><br><small>${x('AI supervision of calls comes with the backend.','Supravegherea AI a apelurilor vine odată cu backend-ul.')}</small></p>`;
if(se.st=='paid')h+=se[sd?'ca':'cb']?`<p class=mu>${x('You confirmed. Waiting for the other person.','Ai confirmat. Se așteaptă și cealaltă persoană.')}</p>`:`<button class=btn onclick=fin(${t.id})>${x('Confirm the session took place','Confirmă că sesiunea a avut loc')}</button>`;
else h+=`<div class=row>${sd&&!t.rd?`<button class=btn onclick=rt(${t.id})>${x('Rate and comment','Notează și comentează')}</button>`:''}${(t.rep||[]).includes(u.id)?'':`<button class=bt2 onclick=rp(${t.id})>${x('Report','Raportează')}</button>`}</div>`}}
return h+'</div>'}
const G=i=>S.th.find(t=>t.id==i);
function ar(i,y){const t=G(i);t.st=y?'active':'no';if(y)t.m.push({sy:1,t:x('Request accepted.','Cerere acceptată.')});sv();render()}
function snd(i){const v=$('#m2').value.trim();if(!v)return;G(i).m.push({f:S.me,t:v});sv();render()}
function bk(i){const u=me(),t=G(i),w=$('#bw').value;if(!w)return tt(x('Choose a date and time.','Alege data și stup.'));u.l--;t.se={w,m:$('#bm').value,st:'paid'};t.m.push({sy:1,t:x('Session booked. 1 '+PT+' spent.','Sesiune programată. 1 '+PT+' folosit.')});sv();render()}
function fin(i){const u=me(),t=G(i),s=t.se;s[t.a==u.id?'ca':'cb']=1;if(s.ca&&s.cb){s.st='done';U(t.b).l++;tt(x('Session completed. The teacher earned 1 '+PT+'.','Sesiune încheiată. Profesorul a primit 1 '+PT+'.'))}else tt(x('Confirmed. Waiting for the other person.','Confirmat. Se așteaptă și cealaltă persoană.'));sv();render()}
function rt(i){mo(`<b>${x('Rate your session','Notează sesiunea')}</b><div class=f><select id=rv>${[5,4,3,2,1].map(n=>`<option value=${n}>${'★'.repeat(n)}</option>`).join('')}</select><textarea id=rc rows=3 placeholder="${x('Comment (checked by AI moderation)','Comentariu (verificat de moderarea AI)')}"></textarea><button class=btn onclick=rs(${i})>${x('Post','Publică')}</button></div>`)}
async function rs(i){const t=G(i),p=U(t.b),v=+$('#rv').value,c=$('#rc').value.trim();if(c){if(!await mod(c))return tt(x('Comment blocked by AI moderation. Keep it respectful.','Comentariu blocat de moderarea AI. Rămâi respectuos.'));p.cm.push(c)}
p.r=(p.r*p.c+v)/(p.c+1);p.c++;t.rd=1;cl();sv();render()}
function rp(i){mo(`<b>${x('Report this person','Raportează persoana')}</b><p class=mu>${x('AI reviews the reason. Upheld reports lead to a warning, then a halved rating, then a 1-year ban. False reports are penalized.','AI analizează motivul. Reclamațiile întemeiate duc la avertisment, apoi la notă înjumătățită, apoi la blocare 1 an. Reclamațiile false sunt penalizate.')}</p><textarea id=rr rows=4 placeholder="${x('What happened?','Ce s-a întâmplat?')}"></textarea><div class=row><button class=btn onclick=rr(${i})>${x('Submit report','Trimite raportul')}</button><button class=bt2 onclick=cl()>${x('Cancel','Anulează')}</button></div>`)}
async function rr(i){const u=me(),t=G(i),p=U(t.a==u.id?t.b:t.a),v=$('#rr').value.trim();if(v.length<10)return tt(x('Describe what happened (at least a sentence).','Descrie ce s-a întâmplat (cel puțin o propoziție).'));
const r=await ask(`A user reports their tutoring partner on a school peer site. Reply only FAIR if the report describes real misconduct (harassment, no-show, unsafe behavior, inappropriate content), else UNFAIR.\nReport: ${v}`),fair=r?/^FAIR/i.test(r):v.length>=25;(t.rep=t.rep||[]).push(u.id);cl();
if(!fair){u.fr++;tt(u.fr>1?x('Report not upheld. Warning: repeated false reports.','Reclamație respinsă. Avertisment: reclamații false repetate.'):x('Report not upheld by AI review.','Reclamație respinsă de analiza AI.'))}
else{p.k++;if(p.k==1)tt(`${p.n}: ${x('warning issued.','avertisment emis.')}`);else if(p.k==2){p.r=p.r/2;p.half=1;tt(`${p.n}: ${x('rating halved to','nota a scăzut la')} ${p.r.toFixed(1)}.`)}else{p.ban=Date.now()+365*864e5;tt(`${p.n}: ${x('banned for 1 year.','blocat 1 an.')}`)}}sv();render()}
const rateV=(u,fs)=>`<div class=c><b>${fs?x('How good are you at each subject?','Cât de bine te pricepi la fiecare materie?'):x('Your subjects','Materiile tale')}</b><p class=mu>${x('Switch off the subjects you do not study. Rate the rest from 1 to 10. You can change this any time in Settings.','Dezactivează materiile pe care nu le studiezi. Notează-le pe celelalte de la 1 la 10. Poți schimba oricând din Setări.')}</p>${SUBJ.map((s,i)=>{const v=u.sc[s[0]]??5;return`<div class="sj${v?'':' off'}"><div class=pr><span class=g1>${E(sn(i))}</span><input type=checkbox class=sw ${v?'checked':''} onchange="tg(${i},this)" aria-label="${E(sn(i))}"></div><div class=ns>${[...Array(10)].map((_,n)=>`<button class="nb${n+1==v?' on':''}" onclick="rv(${i},${n+1},this)">${n+1}</button>`).join('')}</div></div>`}).join('')}<div class=row><button class=btn onclick=done()>${x('Save','Salvează')}</button></div></div>`;
function tg(i,el){const r=el.closest('.sj'),v=el.checked?5:0;me().sc[SUBJ[i][0]]=v;r.classList.toggle('off',!v);r.querySelectstupll('.nb').forEach(b=>b.classList.toggle('on',+b.textContent==v));sv()}
function rv(i,n,el){me().sc[SUBJ[i][0]]=n;el.parentNode.querySelectstupll('.nb').forEach(b=>b.classList.toggle('on',b==el));sv()}
function done(){const u=me();SUBJ.forEach(s=>u.sc[s[0]]=u.sc[s[0]]??5);S.v='feed';sv();render();tt(x('Saved.','Salvat.'))}
function setV(u){return`<div class=c><b>${E(u.n)}</b><br><small>${E(u.e)}, ${lv(u.lv)}, ${E(u.cy)}</small><p>${x('Student ID','Legitimație')}: <span class=tag>${u.ver?x('Verified','Verificată'):x('Pending manual review','În curs de verificare manuală')}</span><br><small>${x('One student ID and one CNP per account. Messaging and in-person meetings need a verified ID.','O legitimație și un CNP per cont. Mesageria și întâlnirile față în față cer o legitimație verificată.')}</small></p><label class=row style="align-items:center"><input type=checkbox class=sw ${u.po?'checked':''} onchange="me().po=this.checked?1:0;sv()"><span>${x('Hide my past requests from AI search','Ascunde cererile mele din căutarea AI')}</span></label><div class=row>${u.ver?'':`<button class=bt2 onclick="me().ver=1;sv();render()">${x('Demo: approve my ID','Demo: aprobă legitimația')}</button>`}<button class=bt2 onclick="S.me=0;sv();render()">${x('Log out','Deconectează-te')}</button><button class=bt2 onclick="S.reg=[];S.th=[];S.me=0;sv();render()">${x('Reset all data','Șterge toate datele')}</button></div></div>`+rateV(u,0)}
function signup(){return`<main class=wrap><div class=pr><span class=logo style="font-size:40px">stup</span><span class=g1></span>${lgb()}</div><p>${x('Learn from students who just got it. Teach what you know and earn a '+PT+' for every session.','Învață de la colegi. Ajută la ce te pricepi și primești un '+PT+' pentru fiecare sesiune.')}</p><div class="c f"><label>${x('Name','Nume')}<input id=nm></label><label>Email<input id=e type=email></label><label>${x('Password','Parolă')}<input id=pw type=password></label><label>${x('School level','Nivel')}<select id=lv>${[0,1,2].map(i=>`<option value=${i}>${lv(i)}</option>`).join('')}</select></label><label>${x('County','Județ')}<select id=cy>${CY.map(c=>`<option>${E(c)}</option>`).join('')}</select></label><label>CNP<input id=cnp inputmode=numeric maxlength=13 placeholder="Demo: 6090101400018"></label><label>${x('Student ID number','Număr legitimație')}<input id=sid></label><label>${x('Photo of your student ID','Poză cu legitimația')}<input id=uf type=file accept="image/*"></label><label>${x('Phone number','Număr de telefon')}<input id=ph type=tel></label><label style="display:flex;gap:8px;align-items:center"><input id=pc type=checkbox style="width:auto"> ${x('I am under 16 and a parent agreed (GDPR)','Am sub 16 ani și un părinte este de acord (GDPR)')}</label><div class=er id=er></div><button class=btn onclick=su()>${x('Create account','Creează cont')}</button><small>${x('You start with 3 '+PT+'. Already have an account?','Începi cu 3 '+PT+'. Ai deja cont?')} <a href="#" onclick="S.au=1;render();return false">${x('Log in','Conectează-te')}</a></small></div></main>`}
const login=()=>`<main class=wrap><div class=pr><span class=logo style="font-size:40px">stup</span><span class=g1></span>${lgb()}</div><div class="c f"><label>Email<input id=e type=email></label><label>${x('Password','Parolă')}<input id=pw type=password></label><div class=er id=er></div><button class=btn onclick=li()>${x('Log in','Conectează-te')}</button><small><a href="#" onclick="S.au=0;render();return false">${x('Create an account','Creează un cont')}</a></small></div></main>`;
function li(){const e=$('#e').value.trim().toLowerCase(),u=S.reg.find(y=>y.e==e&&y.pw==hs($('#pw').value.trim()));if(!u)return $('#er').textContent=x('Wrong email or password.','Email sau parolă greșită.');if(u.ban>Date.now())return $('#er').textContent=x('This account is banned until ','Contul este blocat până la ')+new Date(u.ban).toLocaleDateString();S.me=u.id;S.au=0;S.v='feed';sv();render()}
function su(){const v=i=>$('#'+i).value.trim(),e=v('e').toLowerCase(),c=v('cnp'),s=v('sid').toUpperCase(),er=m=>$('#er').textContent=m;
if(!v('nm'))return er(x('Enter your name.','Introdu numele.'));if(!/^\S+@\S+\.\S+$/.test(e))return er(x('Enter a valid email.','Introdu un email valid.'));if(BAD.test(e.split('@')[1]))return er(x('Tempstupry email addresses are not allowed.','Adresele de email tempstupre nu sunt permise.'));
if(S.reg.some(u=>u.e==e))return er(x('This email already has an account.','Acest email are deja un cont.'));if(v('pw').length<6)return er(x('Password needs at least 6 characters.','Parola trebuie să aibă minim 6 caractere.'));
const a=cnpAge(c);if(a==null)return er(x('This CNP is not valid.','CNP-ul nu este valid.'));if(S.reg.some(u=>u.cn==hs(c)))return er(x('This CNP is already linked to an account.','Acest CNP este deja legat de un cont.'));
if(s.length<4)return er(x('Enter your student ID number.','Introdu numărul legitimației.'));if(S.reg.some(u=>u.si==hs(s)))return er(x('This student ID is already used by another account.','Această legitimație este folosită de alt cont.'));
if(!/^\+?\d{9,14}$/.test(v('ph').replace(/\s/g,'')))return er(x('Enter a valid phone number.','Introdu un număr de telefon valid.'));if(!$('#uf').files.length)return er(x('Upload a photo of your student ID.','Încarcă o poză cu legitimația.'));
if(a<16&&!$('#pc').checked)return er(x('Under 16: parental consent is required.','Sub 16 ani: este necesar acordul părinților.'));
const u={id:Date.now(),e,n:v('nm'),pw:hs(v('pw')),lv:+v('lv'),cy:v('cy'),age:a,cn:hs(c),si:hs(s),ver:0,l:3,sc:{},r:0,c:0,cm:[],k:0,half:0,ban:0,fr:0,po:0};S.reg.push(u);S.me=u.id;S.v='rate';sv();render()}
render();
</script></body></html>
